name: Feature request / 改进建议
description: Explain the learning or authoring problem a change would solve.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: Describe a concrete use case, not only a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome / 期望效果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs / 替代方案与取舍
